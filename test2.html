        font-family: arial, Arial, Helvetica, sans-serif /* alterar o tipo de letra*/

     .menu{

        background-color: rgb(0, 0, 0); 
        color: rgb(255, 0, 255);
     } 
     .menu-lista{
            list-style: none; /* Tirar os pontinhos */
            display: flex;
            padding: 0;
            margin: 0;

     }
     .menu-item{
            margin: 0;
     }
     .menu-item a{
            display: block;
            padding: 15px 20px;
            text-decoration: none;
            color: aliceblue;
     }
     .menu-item a:hover{
         background-color: rgb(0, 183, 255);
     }
     .conteudo{
        background-color: rgb(255, 255, 255);
        text-align: center;
        margin: 20px 10%;
        padding: 10px;
     }
     .conteudo p{
        
        text-align: center;


     }
     

</style>

</head>
